name: Android CI

# Compila, prueba y publica los APK como artifacts descargables.
# No crea releases públicos automáticamente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Los secretos sólo llegan al build si están configurados (ver docs/FIRMA_Y_ACTUALIZACIONES.md).
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Preparar firma (si hay secretos)
        id: signing
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/distribution.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/distribution.keystore" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Firma de distribución: CONFIGURADA"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Firma de distribución: NO configurada (se usará la clave de depuración temporal del runner)"
          fi

      - name: Pruebas unitarias (núcleo + app)
        run: ./gradlew :core3d:test :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: APK de depuración
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: APK de distribución (release, R8)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verificar APK generados
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          test -s "$DEBUG_APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          {
            echo "## Resultado de la compilación"
            echo
            echo "- Commit: \`${GITHUB_SHA::7}\` · ejecución #${GITHUB_RUN_NUMBER} (versionCode = ${GITHUB_RUN_NUMBER})"
            echo "- APK de depuración: \`$(basename "$DEBUG_APK")\` ($(du -h "$DEBUG_APK" | cut -f1))"
            "$BT/apksigner" verify --print-certs "$DEBUG_APK" | grep -E "Signer #1 certificate (DN|SHA-256)" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            REL_APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
            test -s "$REL_APK"
            "$BT/apksigner" verify "$REL_APK"
            echo "release_apk=$REL_APK" >> "$GITHUB_OUTPUT"
            {
              echo "- APK de distribución firmado: \`$(basename "$REL_APK")\` ($(du -h "$REL_APK" | cut -f1))"
              "$BT/apksigner" verify --print-certs "$REL_APK" | grep -E "Signer #1 certificate SHA-256" | sed 's/^/- /' || true
              echo
              echo "✅ Firma de distribución configurada: los APK de esta y de futuras ejecuciones se pueden instalar **como actualización** sobre la anterior (mismo ID y misma firma, versionCode creciente)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "- APK de distribución: se compiló y pasó R8, pero **no se firmó** (faltan secretos); no se publica porque no es instalable."
              echo
              echo "⚠️ **Firma de distribución NO configurada.** El APK de depuración está firmado con una clave temporal del runner: se instala en una instalación nueva, pero **no podrá actualizar** a un APK de otra ejecución (Android lo rechazará por firma distinta). Seguí docs/FIRMA_Y_ACTUALIZACIONES.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir APK de depuración
        uses: actions/upload-artifact@v7
        with:
          name: universal3d-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Subir APK de distribución firmado
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: universal3d-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Subir informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-y-lint
          path: |
            core3d/build/reports/tests/
            core3d/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Limpiar clave del runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/distribution.keystore"
